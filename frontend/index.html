<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Gerenciador de Produtos</h1>
            <div class="search-box">
                <input type="text" id="campo-busca" placeholder="Buscar por nome...">
            </div>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <div class="form-card">
                <h2>Cadastrar Produto</h2>
                <form id="formulario">
                    <div class="form-group">
                        <input type="text" id="nome" placeholder="Nome do produto" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="preco" placeholder="Preço" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <textarea id="descricao" placeholder="Descrição" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">
                        <span>+</span> Cadastrar
                    </button>
                </form>
            </div>
        </section>

        <section class="list-section">
            <div class="list-header">
                <h2>Produtos Cadastrados</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label>Preço mínimo:</label>
                        <input type="number" id="preco-min" placeholder="R$ 0" step="0.01" min="0">
                    </div>
                    <div class="filter-group">
                        <label>Preço máximo:</label>
                        <input type="number" id="preco-max" placeholder="R$ 9999" step="0.01" min="0">
                    </div>
                    <button class="btn-filter" onclick="limparFiltros()">Limpar Filtros</button>
                </div>
            </div>
            <div id="lista-produtos" class="products-grid"></div>
        </section>
    </main>

    <div id="modal-visualizar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modal-visualizar')">&times;</span>
            <h2>Detalhes do Produto</h2>
            <div id="conteudo-visualizar"></div>
        </div>
    </div>

    <div id="modal-editar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal('modal-editar')">&times;</span>
            <h2>Editar Produto</h2>
            <form id="formulario-editar">
                <input type="hidden" id="editar-id">
                <div class="form-group">
                    <input type="text" id="editar-nome" placeholder="Nome" required>
                </div>
                <div class="form-group">
                    <input type="number" id="editar-preco" placeholder="Preço" step="0.01" required>
                </div>
                <div class="form-group">
                    <textarea id="editar-descricao" placeholder="Descrição" rows="3"></textarea>
                </div>
                <button type="submit" class="btn-primary">Atualizar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
